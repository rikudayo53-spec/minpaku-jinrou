name: Build

# main に push すると jar を作って「jar」ブランチに置く。
# コミットメッセージに [test] が入っていると、ゲームを自動で起動してスクリーンショットを
# 「selftest」ブランチに置く（見た目の確認用）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build
        run: |
          set +e
          ./gradlew build --stacktrace > build.log 2>&1
          code=$?
          tail -80 build.log
          mkdir -p /tmp/out
          cp build.log /tmp/out/
          cp build/libs/*.jar /tmp/out/ 2>/dev/null
          rm -f /tmp/out/*-sources.jar
          # 前提MOD（GeckoLib）の使える関数の一覧（開発用）
          GL=$(find .gradle/loom-cache/remapped_mods -name "geckolib-fabric*.jar" 2>/dev/null | head -1)
          if [ -n "$GL" ]; then
            for c in model.GeoModel model.DefaultedBlockGeoModel renderer.GeoBlockRenderer renderer.GeoRenderer animatable.GeoBlockEntity animatable.GeoAnimatable \
                     cache.object.GeoBone cache.object.BakedGeoModel animation.AnimationController animation.RawAnimation animation.AnimatableManager \
                     animation.AnimatableManager\$ControllerRegistrar animation.AnimationState animation.AnimationProcessor util.GeckoLibUtil core.animation.AnimationController \
                     animatable.instance.AnimatableInstanceCache; do
              javap -cp "$GL" "software.bernie.geckolib.$c" >> /tmp/out/geckolib_api.txt 2>&1
            done
            for c in loading.json.typeadapter.KeyFramesAdapter loading.json.typeadapter.BakedAnimationsAdapter loading.object.BakedModelFactory\$Builtin loading.object.BakedModelFactory util.RenderUtil; do
              javap -c -p -cp "$GL" "software.bernie.geckolib.$c" >> /tmp/out/geckolib_code.txt 2>&1
            done
            unzip -l "$GL" | grep -E "\.class" | awk '{print $4}' | grep -E "^software/bernie/geckolib/(animation|model|renderer|animatable|cache/object|util)/[A-Za-z]+\.class" >> /tmp/out/geckolib_api.txt
          fi
          cd /tmp/out
          git init -q
          git checkout -q -b jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "最新ビルド: ${GITHUB_SHA}  (exit ${code})" > README.md
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" jar
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: minpaku-jinrou-jar
          path: build/libs/*.jar

  selftest:
    needs: build
    if: contains(github.event.head_commit.message, '[test]') || contains(github.event.head_commit.message, '[ui]') || contains(github.event.head_commit.message, '[fin]') || contains(github.event.head_commit.message, '[item]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Run the game and take screenshots
        run: |
          set +e
          sudo apt-get install -y -qq xvfb > /dev/null 2>&1
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\\\:flat\nspawn-protection=0\n" > run/server.properties
          MODE=1
          echo "${{ github.event.head_commit.message }}" | grep -q "\[ui\]" && MODE=ui
          echo "${{ github.event.head_commit.message }}" | grep -q "\[fin\]" && MODE=fin
          echo "${{ github.event.head_commit.message }}" | grep -q "\[item\]" && MODE=item
          (sleep 150; echo stop) | timeout 300 ./gradlew runServer --console=plain > server.log 2>&1
          mkdir -p run/saves
          # 仮想画面のソフト描画がまれに固まるので、画面が1枚も撮れずに止まったらやり直す（最大3回）
          for try in 1 2 3; do
            rm -rf run/saves/selftest run/screenshots && cp -r run/world run/saves/selftest
            MINPAKU_SELFTEST=$MODE timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain --args="--quickPlaySingleplayer selftest" > client.log 2>&1
            code=$?
            echo "client exit $code (try $try)" >> client.log
            ls run/screenshots/selftest_*.png > /dev/null 2>&1 && break
          done
          mkdir -p /tmp/out
          cp server.log client.log /tmp/out/
          cp run/screenshots/*.png /tmp/out/ 2>/dev/null
          cd /tmp/out
          git init -q
          git checkout -q -b selftest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Selftest ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" selftest
