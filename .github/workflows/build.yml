name: Build

# main に push すると jar を作って「jar」ブランチに置く。
# コミットメッセージに [test] が入っていると、ゲームを自動で起動してスクリーンショットを
# 「selftest」ブランチに置く（見た目の確認用）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build
        run: |
          set +e
          ./gradlew build --stacktrace > build.log 2>&1
          code=$?
          tail -80 build.log
          mkdir -p /tmp/out
          cp build.log /tmp/out/
          cp build/libs/*.jar /tmp/out/ 2>/dev/null
          rm -f /tmp/out/*-sources.jar
          cd /tmp/out
          git init -q
          git checkout -q -b jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "最新ビルド: ${GITHUB_SHA}  (exit ${code})" > README.md
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" jar
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: minpaku-jinrou-jar
          path: build/libs/*.jar

  selftest:
    needs: build
    if: contains(github.event.head_commit.message, '[test]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Run the game and take screenshots
        run: |
          set +e
          sudo apt-get install -y -qq xvfb > /dev/null 2>&1
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\\\:flat\nspawn-protection=0\n" > run/server.properties
          (sleep 150; echo stop) | timeout 300 ./gradlew runServer --console=plain > server.log 2>&1
          mkdir -p run/saves && cp -r run/world run/saves/selftest
          MINPAKU_SELFTEST=1 timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain --args="--quickPlaySingleplayer selftest" > client.log 2>&1
          echo "client exit $?" >> client.log
          mkdir -p /tmp/out
          cp server.log client.log /tmp/out/
          cp run/screenshots/*.png /tmp/out/ 2>/dev/null
          cd /tmp/out
          git init -q
          git checkout -q -b selftest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Selftest ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" selftest
